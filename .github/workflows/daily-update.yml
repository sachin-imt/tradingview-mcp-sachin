name: Daily Dashboard Update

on:
  schedule:
    # Capture: 22:00 UTC daily, just after the US close, so the dashboard is
    # current overnight.
    - cron: '0 22 * * *'
    # Brief: 07:07 UTC Tue-Sat = 17:07 Sydney on AEST, covering the US session
    # that closed 11 hours earlier. Friday's US session is therefore briefed on
    # Saturday afternoon Sydney time, which is correct by construction.
    # Fixed UTC by the user's choice, so it lands an hour later over AEDT.
    - cron: '7 7 * * 2-6'
  workflow_dispatch: # manual trigger
    inputs:
      send_brief:
        description: 'Also send the brief email'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install chromium --with-deps
        if: env.AJ_USERNAME != ''
        env:
          AJ_USERNAME: ${{ secrets.AJ_USERNAME }}

      - name: Fetch prices (Yahoo Finance)
        run: node pipeline/fetch-prices.js

      - name: Fetch AJ data (if credentials available)
        run: node pipeline/fetch-aj.js
        if: env.AJ_USERNAME != ''
        env:
          AJ_USERNAME: ${{ secrets.AJ_USERNAME }}
          AJ_PASSWORD: ${{ secrets.AJ_PASSWORD }}
        continue-on-error: true

      - name: Fetch consensus estimates
        run: node pipeline/fetch-estimates.js
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        continue-on-error: true

      # Applies a cutover once a company has reported. The sanity gate still
      # holds anything large or unit-suspect for a human — this only commits the
      # switches that pass both checks, which is the boring majority.
      # MUST run before build-eps-series: that script anchors a name still on
      # AJ's estimate to his level, and only takes the raw consensus curve once
      # the name has switched. Running it first would build the curve against
      # the estimate we are about to replace.
      - name: Apply estimate cutovers
        run: node pipeline/apply-estimates.js --apply
        continue-on-error: true

      # Rebuilds the daily NTM accrual curve so the corridor slopes. Must run
      # after prices (it needs the date axis) and before update-data, which
      # consumes eps.json to compute the bands.
      - name: Build daily EPS accrual series
        run: node pipeline/build-eps-series.js
        continue-on-error: true

      - name: Update computed data (bands, snapshots, eps sync)
        run: node pipeline/update-data.js

      - name: Build dashboard
        run: node pipeline/build.js

      - name: Daily corridor briefing
        run: node pipeline/briefing.js
        continue-on-error: true

      # Only on the 07:07 UTC trigger, or a manual run that asks for it. The
      # 22:00 capture run must never mail — it would arrive at 8am Sydney and
      # burn the session, leaving the 5pm brief with nothing new to say.
      # send-brief.js refuses on its own if the session was already sent or the
      # feed is stale, so a double trigger cannot double-send.
      - name: Send brief
        if: github.event.schedule == '7 7 * * 2-6' || inputs.send_brief
        run: node pipeline/send-brief.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/ docs/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily update: $(date -u +%Y-%m-%d) prices and dashboard"
          git push
