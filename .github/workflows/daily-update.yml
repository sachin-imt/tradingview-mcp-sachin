name: Daily Dashboard Update

on:
  schedule:
    # Run at 6 PM ET (22:00 UTC) every day
    - cron: '0 22 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install chromium --with-deps
        if: env.AJ_USERNAME != ''
        env:
          AJ_USERNAME: ${{ secrets.AJ_USERNAME }}

      - name: Fetch prices (Yahoo Finance)
        run: node pipeline/fetch-prices.js

      - name: Fetch AJ data (if credentials available)
        run: node pipeline/fetch-aj.js
        if: env.AJ_USERNAME != ''
        env:
          AJ_USERNAME: ${{ secrets.AJ_USERNAME }}
          AJ_PASSWORD: ${{ secrets.AJ_PASSWORD }}
        continue-on-error: true

      - name: Update computed data (bands, snapshots, eps sync)
        run: node pipeline/update-data.js

      - name: Build dashboard
        run: node pipeline/build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/ docs/index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily update: $(date -u +%Y-%m-%d) prices and dashboard"
          git push
